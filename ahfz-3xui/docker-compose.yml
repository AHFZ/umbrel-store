services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3xui_app
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # FIX 1: Changed $PWD to ${APP_DATA_DIR}/data for persistent Umbrel storage
      - ${APP_DATA_DIR}/data/db/:/etc/x-ui/
      - ${APP_DATA_DIR}/data/cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    tty: true
    ports:
      - "2053:2053"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: 3xui_postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: xui
      POSTGRES_PASSWORD: xui
      POSTGRES_DB: xui
    volumes:
      # FIX 2: Changed $PWD to ${APP_DATA_DIR}/data for persistent Postgres storage
      - ${APP_DATA_DIR}/data/pgdata/:/var/lib/postgresql/data
    restart: unless-stopped
